name: Code Quality and Metrics

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-quality:
    name: Backend Quality & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests and JaCoCo Coverage
        working-directory: ./backend
        run: mvn -B org.jacoco:jacoco-maven-plugin:prepare-agent test org.jacoco:jacoco-maven-plugin:report

      - name: Run PMD Code Quality Check
        working-directory: ./backend
        run: mvn -B pmd:pmd
        continue-on-error: true

      - name: Run PMD Copy/Paste Detector (Duplications)
        working-directory: ./backend
        run: mvn -B pmd:cpd
        continue-on-error: true

      - name: Run Checkstyle
        working-directory: ./backend
        run: mvn -B checkstyle:checkstyle
        continue-on-error: true

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

  frontend-quality:
    name: Frontend Quality & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install jscpd and vitest coverage
        working-directory: ./frontend
        run: npm install -D jscpd @vitest/coverage-v8

      - name: Run ESLint (Code Quality)
        working-directory: ./frontend
        # Runs lint without --fix to catch errors on CI
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts --ignore-path .gitignore

      - name: Run jscpd (Code Duplication)
        working-directory: ./frontend
        run: npx jscpd ./src
        continue-on-error: true

      - name: Run Vitest (Code Coverage)
        working-directory: ./frontend
        run: npx vitest run --coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
